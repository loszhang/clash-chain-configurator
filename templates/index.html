<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash 链式代理配置</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #334155;
            --success: #10b981;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image:
                radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 1) 0, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 2rem;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background-color: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .full-width {
            grid-column: 1 / -1;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.25rem;
            color: var(--text-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
            display: inline-block;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 500;
        }

        input[type="text"],
        input[type="number"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            color: var(--text-color);
            font-size: 1rem;
            transition: all 0.2s;
            box-sizing: border-box;
            /* Fix padding issue */
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 0.75rem 1.5rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            box-sizing: border-box;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-copy {
            background-color: var(--text-muted);
            margin-top: 1rem;
        }

        .btn-copy:hover {
            background-color: #64748b;
        }

        .result-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 0.5rem;
            word-break: break-all;
            font-family: monospace;
            color: #bef264;
            display: none;
        }

        .result-box.visible {
            display: block;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--success);
            color: white;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Checkbox style */
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        input[type="checkbox"] {
            width: 1.25rem;
            height: 1.25rem;
            accent-color: var(--primary);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Clash 链式代理配置</h1>

        <div class="grid">
            <!-- Settings Card -->
            <div class="card full-width">
                <h2>🏠 住宅 IP 节点配置</h2>
                <form id="configForm">
                    <div class="grid" style="gap: 1rem;">
                        <div class="form-group">
                            <label for="name">节点名称 (Name)</label>
                            <input type="text" id="name" name="name" placeholder="例如: 🇺🇸 住宅IP-洛杉矶" required>
                        </div>
                        <div class="form-group">
                            <label for="server">服务器地址 (Server IP)</label>
                            <input type="text" id="server" name="server" placeholder="1.2.3.4" required>
                        </div>
                        <div class="form-group">
                            <label for="port">端口 (Port)</label>
                            <input type="number" id="port" name="port" placeholder="443" required>
                        </div>
                        <div class="form-group">
                            <label for="username">用户名 (Username)</label>
                            <input type="text" id="username" name="username" placeholder="user123" required>
                        </div>
                        <div class="form-group">
                            <label for="password">密码 (Password)</label>
                            <input type="password" id="password" name="password" placeholder="pass123" required>
                        </div>
                        <div class="form-group checkbox-wrapper" style="align-self: flex-end; padding-bottom: 0.5rem;">
                            <input type="checkbox" id="udp" name="udp">
                            <label for="udp" style="margin:0; cursor:pointer;">启用 UDP (Enable UDP)</label>
                        </div>
                    </div>
                    <button type="submit" class="btn" style="margin-top: 1rem;">💾 保存配置</button>
                </form>
            </div>

            <!-- Converter Card -->
            <div class="card full-width">
                <h2>🔗 生成订阅链接</h2>
                <div class="form-group">
                    <label for="subUrl">原始订阅链接 (Sub URL)</label>
                    <input type="text" id="subUrl" placeholder="粘贴机场或者其他订阅链接..." required>
                </div>
                <button id="convertBtn" class="btn">🚀 生成本地链接</button>

                <div id="resultArea" class="result-box">
                    <div id="finalLink"></div>
                </div>
                <button id="copyBtn" class="btn btn-copy" style="display:none;">📄 复制链接</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">✅ 配置已保存!</div>

    <script>
        // Load initial config
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/config');
                const data = await res.json();
                if (data) {
                    document.getElementById('name').value = data.name || '';
                    document.getElementById('server').value = data.server || '';
                    document.getElementById('port').value = data.port || '';
                    document.getElementById('username').value = data.username || '';
                    document.getElementById('password').value = data.password || '';
                    document.getElementById('udp').checked = data.udp || false;
                }
            } catch (e) {
                console.error('Failed to load config', e);
            }
        });

        // Save config
        document.getElementById('configForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const config = Object.fromEntries(formData.entries());
            config.port = parseInt(config.port);
            config.udp = document.getElementById('udp').checked;

            try {
                const res = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });

                if (res.ok) {
                    showToast();
                } else {
                    alert('保存失败');
                }
            } catch (e) {
                alert('网络错误');
            }
        });

        // Generate Link
        document.getElementById('convertBtn').addEventListener('click', () => {
            const subUrl = document.getElementById('subUrl').value.trim();
            if (!subUrl) {
                alert('请先输入订阅链接');
                return;
            }

            // Construct the local link
            const currentOrigin = window.location.origin;
            const finalUrl = `${currentOrigin}/convert?url=${encodeURIComponent(subUrl)}`;

            const resultArea = document.getElementById('resultArea');
            const finalLinkDiv = document.getElementById('finalLink');
            const copyBtn = document.getElementById('copyBtn');

            finalLinkDiv.textContent = finalUrl;
            resultArea.classList.add('visible');
            copyBtn.style.display = 'inline-flex';
        });

        // Copy Link - 兼容 HTTP 和 HTTPS 环境
        document.getElementById('copyBtn').addEventListener('click', () => {
            const text = document.getElementById('finalLink').textContent;
            const btn = document.getElementById('copyBtn');
            const originalText = btn.textContent;

            // 尝试使用现代 Clipboard API (HTTPS/localhost)
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    btn.textContent = '✅ 已复制!';
                    setTimeout(() => btn.textContent = originalText, 2000);
                }).catch(err => {
                    console.error('复制失败:', err);
                    fallbackCopy(text, btn, originalText);
                });
            } else {
                // 降级方案 - 使用传统方法 (HTTP)
                fallbackCopy(text, btn, originalText);
            }
        });

        // 降级复制方法（兼容 HTTP）
        function fallbackCopy(text, btn, originalText) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.top = '0';
            textarea.style.left = '0';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    btn.textContent = '✅ 已复制!';
                    setTimeout(() => btn.textContent = originalText, 2000);
                } else {
                    btn.textContent = '❌ 复制失败';
                    setTimeout(() => btn.textContent = originalText, 2000);
                }
            } catch (err) {
                console.error('复制失败:', err);
                btn.textContent = '❌ 复制失败';
                setTimeout(() => btn.textContent = originalText, 2000);
            }

            document.body.removeChild(textarea);
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>

</html>
